[tool.poetry]
name = "auto_layout_old_without_heatmap"
version = "0.1.0"
description = ""
authors = ["aodnoral@synetra"]
readme = "README.md"
packages = [
    { include = "evaluate" },
    { include = "searchdet_pipeline" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.dependencies]
python = "^3.12"
torch = "2.4.*"
torchvision = ">=0.15.0"
torchmetrics = "^1.0.0"
transformers = ">=4.34.0"
accelerate = ">=0.21.0"
opencv-python = ">=4.8.0"
opencv-contrib-python = ">=4.8.0"
Pillow = ">=9.5.0"
numpy = ">=2.1.0,<3.0.0"     # <-- обновлено (совместимо с langchain-community 0.3.27)
scipy = ">=1.10.0"
hydra-core = ">=1.3.0"
iopath = ">=0.1.9"
timm = ">=0.6.7"
matplotlib = ">=3.7.0"
tqdm = ">=4.65.0"
requests = ">=2.31.0"
protobuf = ">=3.20.0"
sentencepiece = ">=0.1.99"
einops = ">=0.6.1"
gradio = ">=3.35.0"
gradio_client = ">=0.2.9"
markdown2 = { version = ">=2.4.10", extras = ["all"] }
huggingface-hub = ">=0.16.4"

gdown = ">=4.7.1"
kagglehub = ">=0.2.0"
seaborn = ">=0.12.0"
pandas = ">=2.0.0"
scikit-learn = ">=1.3.0"
typer = "^0.9.0"
rich = "^13.0.0"
PyYAML = "^6.0"
dinov3 = { path = "dinov3", develop = true }

faiss-cpu = "*"
segment-anything-hq = "0.3"
selenium = "4.35.0"
langchain = "0.3.27"
langchain-community = "0.3.27"   # требует numpy >= 2.1.0
langchain-core = "0.3.75"
langchain-text-splitters = "0.3.11"
scikit-image = "0.25.2"
safetensors = ">=0.4.3"        
tokenizers = ">=0.14,<0.21"      
av = ">=10.0.0"
ultralytics = "8.3.192"
segment-anything = { git = "https://github.com/facebookresearch/segment-anything.git" }
coloredlogs = "*"
onnx = "*"
onnxruntime = "*"
pycocotools = "*"

[tool.poetry.group.dev.dependencies]
mypy = "^1.10.0"
ruff = "^0.5.0"
pre-commit = "^3.5.0"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::UserWarning:timm.*",
    "ignore::UserWarning:segment_anything_hq.*",
    "ignore::pytest.PytestReturnNotNoneWarning"
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
exclude = "vendor/|gradio_client/|searchdet_pipeline/"
[[tool.mypy.overrides]]
module = ["searchdet_pipeline.*"]
follow_imports = "skip"
ignore_errors = true

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "*.ipynb",
    "research"
]
line-length = 120
indent-width = 2
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]
ignore = ["E402", "E501", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
