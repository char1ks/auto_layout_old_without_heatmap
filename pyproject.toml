[tool.poetry]
name = "auto_layout_old_without_heatmap"
version = "0.1.0"
description = ""
authors = ["aodnoral@synetra"]
readme = "README.md"
packages = [
    { include = "evaluate" },
    { include = "searchdet_pipeline" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.12"
torch = { version = "2.3.1", source = "torch-gpu" }
torchvision = "0.18.1"
transformers = "^4.34.0"
accelerate = "^0.21.0"
opencv-python = "^4.8.0"
opencv-contrib-python = "^4.8.0"
Pillow = "^9.5.0"
numpy = "1.26.4"
scipy = "^1.10.0"
hydra-core = "^1.3.0"
iopath = "^0.1.9"
timm = "^0.6.7"
matplotlib = "^3.7.0"
tqdm = "^4.65.0"
requests = "^2.31.0"
protobuf = "^3.20.0"
sentencepiece = "^0.1.99"
einops = "^0.6.1"
gradio = "^3.35.0"
gradio_client = "^0.2.9"
markdown2 = { version = "^2.4.10", extras = ["all"] }
huggingface-hub = "^0.16.4"

gdown = "^4.7.1"
kagglehub = "^0.2.0"
seaborn = "^0.12.0"
pandas = "^2.0.0"
scikit-learn = "^1.3.0"
typer = "^0.9.0"
rich = "^13.0.0"
PyYAML = "^6.0"

[[tool.poetry.source]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
mypy = "^1.10.0"
ruff = "^0.5.0"
pre-commit = "^3.5.0"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::UserWarning:timm.*",
    "ignore::UserWarning:segment_anything_hq.*",
    "ignore::pytest.PytestReturnNotNoneWarning"
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
exclude = "vendor/|gradio_client/|searchdet_pipeline/"
[[tool.mypy.overrides]]
module = ["searchdet_pipeline.*"]
follow_imports = "skip"
ignore_errors = true

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    "vendor",
    "gradio_client",
    "searchdet-main",
    "searchdet_pipeline",
    ".venv",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402"]